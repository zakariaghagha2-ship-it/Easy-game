<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberConnect 4 - AI 1v1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #080911;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95vw;
            max-width: 450px;
            margin-bottom: 15px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .player-title {
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
        }

        .score-val {
            font-size: 24px;
            font-weight: bold;
        }

        .p-user { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.6); }
        .p-ai { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.6); }

        .difficulty-selector {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn.active {
            background: #00ffcc;
            color: #080911;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            border-color: #00ffcc;
        }

        .game-container {
            position: relative;
            width: 95vw;
            max-width: 450px;
        }

        canvas {
            width: 100%;
            height: auto;
            background: rgba(18, 21, 38, 0.8);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 204, 0.1);
            cursor: pointer;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 17, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 28px;
            text-align: center;
            padding: 0 10px;
        }

        .btn-restart {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            color: #080911;
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        .ai-status {
            margin-top: 10px;
            font-size: 14px;
            color: #ff0055;
            height: 20px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="player-card">
            <span class="player-title">أنت 👤</span>
            <span class="score-val p-user" id="userScore">0</span>
        </div>
        <div class="player-card">
            <span class="player-title">الذكاء الاصطناعي 🤖</span>
            <span class="score-val p-ai" id="aiScore">0</span>
        </div>
    </div>

    <div class="difficulty-selector">
        <button class="diff-btn" id="btn-easy">سهل</button>
        <button class="diff-btn" id="btn-med">متوسط</button>
        <button class="diff-btn active" id="btn-hard">خارق 🔥</button>
    </div>

    <div class="game-container">
        <canvas id="board" width="700" height="600"></canvas>
        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">CyberConnect 4</h2>
            <button class="btn-restart" id="startBtn">ابدأ المواجهة</button>
        </div>
    </div>

    <div class="ai-status" id="aiStatus"></div>

    <script>
        const canvas = document.getElementById("board");
        const ctx = canvas.getContext("2d");
        const userScoreEl = document.getElementById("userScore");
        const aiScoreEl = document.getElementById("aiScore");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const aiStatus = document.getElementById("aiStatus");
        const startBtn = document.getElementById("startBtn");

        const ROWS = 6;
        const COLS = 7;
        const CELL_SIZE = 100;
        const RADIUS = 38;

        const EMPTY = 0;
        const PLAYER = 1; 
        const AI = 2;     

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
        let userScore = 0;
        let aiScore = 0;
        let isGameOver = false;
        let isAiThinking = false;
        let maxDepth = 6; 
        let hoverCol = -1;
        let particles = [];

        // إنشاء محرك الصوت بشكل آمن عند التفاعل الأول فقط
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'drop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        // إعداد مستوى الصعوبة
        function setupDiffBtns() {
            const btnEasy = document.getElementById('btn-easy');
            const btnMed = document.getElementById('btn-med');
            const btnHard = document.getElementById('btn-hard');

            function selectDiff(depth, btn) {
                maxDepth = depth;
                [btnEasy, btnMed, btnHard].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            btnEasy.onclick = () => selectDiff(2, btnEasy);
            btnMed.onclick = () => selectDiff(4, btnMed);
            btnHard.onclick = () => selectDiff(6, btnHard);
        }
        setupDiffBtns();

        // الذكاء الاصطناعي
        function isValidLocation(b, col) { return b[0][col] === EMPTY; }

        function getNextOpenRow(b, col) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (b[r][col] === EMPTY) return r;
            }
            return -1;
        }

        function winningMove(b, piece) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (b[r][c] === piece && b[r][c+1] === piece && b[r][c+2] === piece && b[r][c+3] === piece) return true;
                }
            }
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (b[r][c] === piece && b[r+1][c] === piece && b[r+2][c] === piece && b[r+3][c] === piece) return true;
                }
            }
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (b[r][c] === piece && b[r+1][c+1] === piece && b[r+2][c+2] === piece && b[r+3][c+3] === piece) return true;
                }
            }
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    if (b[r][c] === piece && b[r-1][c+1] === piece && b[r-2][c+2] === piece && b[r-3][c+3] === piece) return true;
                }
            }
            return false;
        }

        function evaluateWindow(window, piece) {
            let score = 0;
            let oppPiece = (piece === PLAYER) ? AI : PLAYER;
            let countPiece = window.filter(p => p === piece).length;
            let countEmpty = window.filter(p => p === EMPTY).length;
            let countOpp = window.filter(p => p === oppPiece).length;

            if (countPiece === 4) score += 100;
            else if (countPiece === 3 && countEmpty === 1) score += 10;
            else if (countPiece === 2 && countEmpty === 2) score += 4;

            if (countOpp === 3 && countEmpty === 1) score -= 80;
            return score;
        }

        function scorePosition(b, piece) {
            let score = 0;
            let centerArray = [];
            for (let r = 0; r < ROWS; r++) centerArray.push(b[r][Math.floor(COLS / 2)]);
            score += centerArray.filter(p => p === piece).length * 6;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    score += evaluateWindow([b[r][c], b[r][c+1], b[r][c+2], b[r][c+3]], piece);
                }
            }
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 3; r++) {
                    score += evaluateWindow([b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]], piece);
                }
            }
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    score += evaluateWindow([b[r][c], b[r+1][c+1], b[r+2][c+2], b[r+3][c+3]], piece);
                }
            }
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    score += evaluateWindow([b[r][c], b[r-1][c+1], b[r-2][c+2], b[r-3][c+3]], piece);
                }
            }
            return score;
        }

        function getValidLocations(b) {
            let valid = [];
            for (let c = 0; c < COLS; c++) {
                if (isValidLocation(b, c)) valid.push(c);
            }
            return valid;
        }

        function isTerminalNode(b) {
            return winningMove(b, PLAYER) || winningMove(b, AI) || getValidLocations(b).length === 0;
        }

        function minimax(b, depth, alpha, beta, maximizingPlayer) {
            let validLocations = getValidLocations(b);
            let isTerminal = isTerminalNode(b);

            if (depth === 0 || isTerminal) {
                if (isTerminal) {
                    if (winningMove(b, AI)) return [null, 10000000];
                    else if (winningMove(b, PLAYER)) return [null, -10000000];
                    else return [null, 0];
                } else {
                    return [null, scorePosition(b, AI)];
                }
            }

            if (maximizingPlayer) {
                let value = -Infinity;
                let bestCol = validLocations[Math.floor(Math.random() * validLocations.length)];
                for (let col of validLocations) {
                    let row = getNextOpenRow(b, col);
                    let bCopy = b.map(arr => [...arr]);
                    bCopy[row][col] = AI;
                    let newScore = minimax(bCopy, depth - 1, alpha, beta, false)[1];
                    if (newScore > value) {
                        value = newScore;
                        bestCol = col;
                    }
                    alpha = Math.max(alpha, value);
                    if (alpha >= beta) break;
                }
                return [bestCol, value];
            } else {
                let value = Infinity;
                let bestCol = validLocations[Math.floor(Math.random() * validLocations.length)];
                for (let col of validLocations) {
                    let row = getNextOpenRow(b, col);
                    let bCopy = b.map(arr => [...arr]);
                    bCopy[row][col] = PLAYER;
                    let newScore = minimax(bCopy, depth - 1, alpha, beta, true)[1];
                    if (newScore < value) {
                        value = newScore;
                        bestCol = col;
                    }
                    beta = Math.min(beta, value);
                    if (alpha >= beta) break;
                }
                return [bestCol, value];
            }
        }

        function makeMove(col, piece) {
            if (!isValidLocation(board, col) || isGameOver) return false;

            let row = getNextOpenRow(board, col);
            board[row][col] = piece;
            playSound('drop');
            createParticles((col + 0.5) * CELL_SIZE, (row + 0.5) * CELL_SIZE, piece === PLAYER ? '#00ffcc' : '#ff0055');

            if (winningMove(board, piece)) {
                endGame(piece);
                return true;
            }

            if (getValidLocations(board).length === 0) {
                endGame(0);
                return true;
            }

            return true;
        }

        function triggerAi() {
            if (isGameOver) return;
            isAiThinking = true;
            aiStatus.innerText = "الذكاء الاصطناعي يفكر... 🧠";

            setTimeout(() => {
                let [aiCol, score] = minimax(board, maxDepth, -Infinity, Infinity, true);
                makeMove(aiCol, AI);
                isAiThinking = false;
                aiStatus.innerText = "";
                draw();
            }, 250);
        }

        function endGame(winner) {
            isGameOver = true;
            setTimeout(() => {
                if (winner === PLAYER) {
                    userScore++;
                    userScoreEl.innerText = userScore;
                    overlayTitle.innerText = "🎉 مبروك! قهرت الذكاء الاصطناعي!";
                    overlayTitle.style.color = "#00ffcc";
                    playSound('win');
                } else if (winner === AI) {
                    aiScore++;
                    aiScoreEl.innerText = aiScore;
                    overlayTitle.innerText = "💀 الذكاء الاصطناعي هزمك!";
                    overlayTitle.style.color = "#ff0055";
                    playSound('lose');
                } else {
                    overlayTitle.innerText = "🤝 تعادل!";
                    overlayTitle.style.color = "#ffffff";
                }
                overlay.classList.remove('hidden');
            }, 400);
        }

        function resetGame() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
            isGameOver = false;
            isAiThinking = false;
            aiStatus.innerText = "";
            particles = [];
            overlay.classList.add('hidden');
            draw();
        }

        startBtn.onclick = function() {
            resetGame();
        };

        function handleInput(clientX) {
            if (isGameOver || isAiThinking || !overlay.classList.contains('hidden')) return;
            const rect = canvas.getBoundingClientRect();
            const col = Math.floor((clientX - rect.left) / (rect.width / COLS));

            if (col >= 0 && col < COLS && isValidLocation(board, col)) {
                if (makeMove(col, PLAYER)) {
                    draw();
                    if (!isGameOver) triggerAi();
                }
            }
        }

        canvas.addEventListener('click', e => handleInput(e.clientX));
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (e.touches && e.touches.length > 0) {
                handleInput(e.touches[0].clientX);
            }
        }, { passive: false });

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let x = c * CELL_SIZE + CELL_SIZE / 2;
                    let y = r * CELL_SIZE + CELL_SIZE / 2;

                    ctx.beginPath();
                    ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = "#0d0f1b";
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (board[r][c] !== EMPTY) {
                        ctx.shadowBlur = 18;
                        if (board[r][c] === PLAYER) {
                            ctx.fillStyle = "#00ffcc";
                            ctx.shadowColor = "#00ffcc";
                        } else {
                            ctx.fillStyle = "#ff0055";
                            ctx.shadowColor = "#ff0055";
                        }
                        ctx.beginPath();
                        ctx.arc(x, y, RADIUS - 4, 0, Math.PI * 2);
